services:
  insnet:
    build: .
    container_name: insnet
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "18080:18080"
    environment:
      INS_PASSWORD: ${INS_PASSWORD:?在 .env 中设置至少 12 位的管理密码}
      INS_ARCHIVE_ROOT: /archive
    volumes:
      - ./data:/data
      - ./archive:/archive
