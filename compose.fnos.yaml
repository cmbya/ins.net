# 飞牛桌面：Docker → Compose → 新增项目 → 创建 YAML，粘贴本文件。
# 部署前把 INS_PASSWORD 改成至少 12 位的独立密码。
services:
  insnet:
    build:
      context: "https://github.com/cmbya/ins.net.git#main"
    container_name: insnet
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "18088:18080"
    environment:
      INS_PASSWORD: "请在这里改成至少12位的独立密码"
      INS_ARCHIVE_ROOT: /archive
    volumes:
      - insnet-data:/data
      - /vol2/1000/docker/INS/insnet:/archive

volumes:
  insnet-data:
