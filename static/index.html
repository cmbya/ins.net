<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ins.net · Instagram 归档</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div><strong>ins.net</strong><span>Instagram 本地归档</span></div><button id="refresh" hidden>刷新</button></header>
  <main>
    <section id="login" class="panel narrow"><h1>登录归档</h1><form id="login-form"><label>管理密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
    <div id="workspace" hidden>
      <section class="intro"><h1>你的 Instagram 归档</h1><p>关注博主的帖子和 Reels，加上你保存的帖子。轮播会保留每张图片和每段视频。</p></section>
      <div id="notice" role="status"></div>
      <section class="panel"><div class="title"><h2>账号</h2><select id="account"></select></div>
        <details><summary>添加账号 / 更新 Cookie</summary><form id="account-form"><label>Instagram 用户名<input name="username" placeholder="your_username" required></label><label>Netscape 格式 Cookie 文件<input name="cookies" type="file" accept=".txt" required></label><button>保存账号</button></form><p class="hint">Cookie 保存在本地数据目录，必须包含 instagram.com 的 sessionid。相同用户名会更新 Cookie。请勿上传到公开仓库。</p></details>
      </section>
      <section class="panel" id="actions"><div class="title"><h2>同步</h2><span class="hint">后台每 6 小时自动同步一次（可配置）</span></div><div class="buttons"><button data-kind="following">导入关注列表</button><button data-kind="creators">同步博主</button><button data-kind="saved">同步已保存</button><button data-kind="all" class="primary">全部同步</button></div></section>
      <section class="panel"><div class="title"><h2>关注博主</h2><span class="hint">导入后选中需要监控的博主</span></div><form id="creator-form"><input name="username" placeholder="手动添加博主用户名" aria-label="博主用户名" required><button>添加并监控</button></form><div id="creators" class="creator-list"></div></section>
      <section class="panel"><div class="title"><h2>归档记录</h2><span id="post-count" class="hint"></span></div><div id="posts" class="post-list"></div></section>
      <section class="panel"><h2>最近任务</h2><div id="runs" class="run-list"></div></section>
    </div>
  </main>
</body>
</html>
